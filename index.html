<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Night Lane Rush</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f1a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  canvas{display:block;width:100%;height:100%;outline:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";

// ---------- setup ----------
var cv = document.getElementById("c");
var ctx = cv.getContext("2d");
var W = 400, H = 700;                    // logical game size
var scale = 1, ox = 0, oy = 0, dpr = 1;
var visX0 = 0, visX1 = W, visY0 = 0, visY1 = H;   // visible world bounds (fills any screen shape)

function resize(){
  dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.floor(window.innerWidth * dpr));
  cv.height = Math.max(1, Math.floor(window.innerHeight * dpr));
  scale = Math.min(cv.width / W, cv.height / H);
  ox = (cv.width - W * scale) / 2;
  oy = (cv.height - H * scale) / 2;
  visX0 = -ox / scale; visX1 = (cv.width - ox) / scale;
  visY0 = -oy / scale; visY1 = (cv.height - oy) / scale;
}
window.addEventListener("resize", resize);
resize();

var isTouch = ("ontouchstart" in window) || (typeof navigator !== "undefined" && navigator.maxTouchPoints > 0);

// ---------- constants ----------
var ROAD_X = 50, LANE_W = 100, LANES = 3;
var PLAYER_Y = H - 130, PLAYER_W = 46, PLAYER_H = 76;
var BTN_PAUSE = { x: 12, y: 12, w: 44, h: 44 };
var BTN_MUTE  = { x: 62, y: 12, w: 44, h: 44 };
function laneX(i){ return ROAD_X + LANE_W * i + LANE_W / 2; }
function hit(b, wx, wy){ return wx >= b.x && wx <= b.x + b.w && wy >= b.y && wy <= b.y + b.h; }

// ---------- state ----------
var state = "menu";   // menu | play | over
var paused = false, muted = false, newBest = false;
var player, obstacles, coins, powerups, particles;
var score, distance, speed, spawnT, shake, roadOffset, gameTime, overAt = 0;
var best = 0;
try { best = parseInt(localStorage.getItem("nightlanerush_best") || "0", 10) || 0; } catch(e){}
try { muted = localStorage.getItem("nightlanerush_muted") === "1"; } catch(e){}

// background streaks (parallax city lights on the sides)
var stars = [];
for (var si = 0; si < 90; si++){
  stars.push({ x: -900 + Math.random() * 2200, y: Math.random() * H, len: 14 + Math.random() * 40,
               v: 0.25 + Math.random() * 0.6, c: Math.random() < 0.7 ? "#4cc9f0" : "#ffd166" });
}

function resetGame(){
  player = { lane: 1, x: laneX(1), shield: false };
  obstacles = []; coins = []; powerups = []; particles = [];
  score = 0; distance = 0; speed = 320; spawnT = 0.6;
  shake = 0; roadOffset = 0; gameTime = 0;
  paused = false; newBest = false;
}
resetGame();

// ---------- ad-platform hooks (safe no-ops until a portal SDK is present) ----------
var sdkActive = false;
function sdkCall(name){
  try { var s = window.PokiSDK; if (s && typeof s[name] === "function") s[name](); } catch(e){}
}
function sdkStart(){ if (sdkActive) return; sdkActive = true; sdkCall("gameplayStart"); }
function sdkStop(){ if (!sdkActive) return; sdkActive = false; sdkCall("gameplayStop"); }

// ---------- audio ----------
var actx = null;
function initAudio(){
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ actx = null; }
}
function beep(freq, dur, type, vol){
  if (!actx || muted) return;
  try {
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    g.gain.value = vol || 0.05;
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch(e){}
}
function toggleMute(){
  muted = !muted;
  try { localStorage.setItem("nightlanerush_muted", muted ? "1" : "0"); } catch(e){}
  if (!muted) beep(600, 0.06, "triangle", 0.05);
}

// ---------- game flow ----------
function startGame(){
  initAudio();
  resetGame();
  state = "play";
  beep(520, 0.08, "square", 0.05);
  sdkStart();
}
function endGame(){
  state = "over";
  overAt = performance.now();
  shake = 18;
  beep(120, 0.35, "sawtooth", 0.08);
  for (var i = 0; i < 28; i++){
    var a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 280;
    particles.push({ x: player.x, y: PLAYER_Y + PLAYER_H/2, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
                     life: 0.6 + Math.random()*0.4, c: i % 2 ? "#ff5d5d" : "#ffd166" });
  }
  if (score > best){
    best = score; newBest = score > 0;
    try { localStorage.setItem("nightlanerush_best", String(best)); } catch(e){}
  }
  sdkStop();
}
function pauseGame(){
  if (state !== "play" || paused) return;
  paused = true;
  sdkStop();
}
function resumeGame(){
  if (!paused) return;
  paused = false;
  last = performance.now();
  sdkStart();
  beep(520, 0.06, "square", 0.04);
}
function togglePause(){ if (paused) resumeGame(); else pauseGame(); }
function moveLane(d){
  if (state !== "play" || paused) return;
  var n = player.lane + d;
  if (n < 0 || n > LANES - 1) return;
  player.lane = n;
  beep(380 + n * 60, 0.05, "triangle", 0.04);
}

// ---------- input ----------
function onKey(e){
  var k = e.key, c = e.code;
  if (k === "Escape" || c === "Escape" || k === "p" || k === "P" || c === "KeyP"){
    e.preventDefault();
    if (!e.repeat) togglePause();
    return;
  }
  if (k === "m" || k === "M" || c === "KeyM"){ if (!e.repeat) toggleMute(); return; }
  var left  = (k === "ArrowLeft"  || c === "ArrowLeft"  || k === "a" || k === "A" || c === "KeyA");
  var right = (k === "ArrowRight" || c === "ArrowRight" || k === "d" || k === "D" || c === "KeyD");
  var go    = (k === " " || k === "Enter" || c === "Space" || c === "Enter");
  if (!(left || right || go)) return;
  e.preventDefault();
  if (e.repeat) return;
  if (state === "menu" || (state === "over" && performance.now() - overAt > 400)){ startGame(); return; }
  if (state !== "play") return;
  if (paused){ resumeGame(); return; }
  if (go){ pauseGame(); return; }
  if (left) moveLane(-1); else if (right) moveLane(1);
}
window.addEventListener("keydown", onKey);

function focusMe(){ try { window.focus(); cv.focus(); } catch(e){} }
cv.setAttribute("tabindex", "0");
window.addEventListener("load", focusMe);

cv.addEventListener("pointerdown", function(e){
  e.preventDefault();
  initAudio(); focusMe();
  var wx = (e.clientX * dpr - ox) / scale, wy = (e.clientY * dpr - oy) / scale;
  if (hit(BTN_MUTE, wx, wy)){ toggleMute(); return; }
  if (state === "play" && !paused && hit(BTN_PAUSE, wx, wy)){ pauseGame(); return; }
  if (state === "menu"){ startGame(); return; }
  if (state === "over"){ if (performance.now() - overAt > 400) startGame(); return; }
  if (paused){ resumeGame(); return; }
  moveLane(e.clientX < window.innerWidth / 2 ? -1 : 1);
});
cv.addEventListener("contextmenu", function(e){ e.preventDefault(); });

document.addEventListener("visibilitychange", function(){ if (document.hidden) pauseGame(); last = performance.now(); });
window.addEventListener("blur", function(){ pauseGame(); });

// ---------- spawning ----------
function spawnY(){ return Math.min(-80, visY0 - 80); }
function spawn(){
  var free = [0,1,2];
  var n = (gameTime > 8 && Math.random() < 0.35) ? 2 : 1;   // never block all 3 lanes
  var sy = spawnY();
  for (var i = 0; i < n; i++){
    var idx = Math.floor(Math.random() * free.length);
    var lane = free.splice(idx, 1)[0];
    obstacles.push({ lane: lane, y: sy, w: 58, h: 64 });
  }
  if (free.length && Math.random() < 0.45){
    var cl = free[Math.floor(Math.random() * free.length)];
    if (!player.shield && gameTime > 6 && Math.random() < 0.18){
      powerups.push({ lane: cl, y: sy + 30, r: 15 });   // shield pickup
    } else {
      coins.push({ lane: cl, y: sy + 30, r: 13 });
    }
  }
}

// ---------- update ----------
function update(dt){
  if (paused) return;
  var sp = state === "play" ? speed : 200;
  roadOffset = (roadOffset + sp * dt) % 60;
  for (var s = 0; s < stars.length; s++){
    var st = stars[s];
    st.y += sp * st.v * dt;
    if (st.y > visY1 + 60){ st.y = visY0 - 60 - Math.random() * 80; st.x = -900 + Math.random() * 2200; }
  }
  for (var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - 40 * dt);
  if (state !== "play") return;

  gameTime += dt;
  speed = Math.min(820, 320 + gameTime * 9);
  distance += speed * dt;
  score = Math.floor(distance / 40);
  player.x += (laneX(player.lane) - player.x) * Math.min(1, dt * 18);

  spawnT -= dt;
  if (spawnT <= 0){
    spawn();
    spawnT = Math.max(0.34, 0.95 - gameTime * 0.012) * (320 / speed) * 1.6;
  }

  var px = player.x - PLAYER_W/2 + 4, py = PLAYER_Y + 6, pw = PLAYER_W - 8, ph = PLAYER_H - 12;
  var despawnY = Math.max(H, visY1) + 90;
  for (var j = obstacles.length - 1; j >= 0; j--){
    var o = obstacles[j];
    o.y += speed * dt;
    var ox_ = laneX(o.lane) - o.w/2 + 4, oy_ = o.y + 4, ow = o.w - 8, oh = o.h - 8;
    if (px < ox_ + ow && px + pw > ox_ && py < oy_ + oh && py + ph > oy_){
      if (player.shield){
        player.shield = false;               // shield absorbs one hit
        shake = 10;
        distance += 200;
        beep(240, 0.15, "square", 0.07);
        for (var q2 = 0; q2 < 14; q2++){
          var sa = Math.random() * Math.PI * 2;
          particles.push({ x: laneX(o.lane), y: o.y + o.h/2, vx: Math.cos(sa)*200, vy: Math.sin(sa)*200, life: 0.4, c: "#4cc9f0" });
        }
        obstacles.splice(j, 1);
        continue;
      }
      endGame(); return;
    }
    if (o.y > despawnY) obstacles.splice(j, 1);
  }
  for (var m = powerups.length - 1; m >= 0; m--){
    var pu = powerups[m];
    pu.y += speed * dt;
    if (Math.abs(laneX(pu.lane) - player.x) < 32 && Math.abs(pu.y - (PLAYER_Y + PLAYER_H/2)) < 48){
      player.shield = true;
      beep(660, 0.12, "triangle", 0.07);
      powerups.splice(m, 1);
    } else if (pu.y > despawnY) powerups.splice(m, 1);
  }
  for (var k = coins.length - 1; k >= 0; k--){
    var c = coins[k];
    c.y += speed * dt;
    var cx = laneX(c.lane);
    if (Math.abs(cx - player.x) < 30 && Math.abs(c.y - (PLAYER_Y + PLAYER_H/2)) < 44){
      distance += 400;                       // coin = +10 score
      beep(880, 0.07, "sine", 0.06);
      for (var q = 0; q < 8; q++){
        var a = Math.random() * Math.PI * 2;
        particles.push({ x: cx, y: c.y, vx: Math.cos(a)*120, vy: Math.sin(a)*120, life: 0.35, c: "#ffd166" });
      }
      coins.splice(k, 1);
    } else if (c.y > despawnY) coins.splice(k, 1);
  }
}

// ---------- drawing ----------
function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function text(t, x, y, size, color, align){
  ctx.fillStyle = color || "#fff";
  ctx.font = "bold " + size + "px system-ui, Arial, sans-serif";
  ctx.textAlign = align || "center";
  ctx.fillText(t, x, y);
}
function dim(a){
  ctx.fillStyle = "rgba(11,15,26," + a + ")";
  ctx.fillRect(visX0 - 40, visY0 - 40, (visX1 - visX0) + 80, (visY1 - visY0) + 80);
}
function button(b){
  ctx.fillStyle = "rgba(255,255,255,0.12)"; rr(b.x, b.y, b.w, b.h, 10); ctx.fill();
}
function drawButtons(){
  var showPause = state === "play";
  if (showPause){
    button(BTN_PAUSE);
    ctx.fillStyle = "#e6e9f5";
    if (paused){   // play triangle
      ctx.beginPath(); ctx.moveTo(BTN_PAUSE.x + 16, BTN_PAUSE.y + 12); ctx.lineTo(BTN_PAUSE.x + 16, BTN_PAUSE.y + 32);
      ctx.lineTo(BTN_PAUSE.x + 32, BTN_PAUSE.y + 22); ctx.closePath(); ctx.fill();
    } else {
      ctx.fillRect(BTN_PAUSE.x + 14, BTN_PAUSE.y + 12, 6, 20); ctx.fillRect(BTN_PAUSE.x + 25, BTN_PAUSE.y + 12, 6, 20);
    }
  }
  // mute button (speaker)
  button(BTN_MUTE);
  var mx = BTN_MUTE.x, my = BTN_MUTE.y;
  ctx.fillStyle = "#e6e9f5";
  ctx.fillRect(mx + 11, my + 17, 6, 10);
  ctx.beginPath(); ctx.moveTo(mx + 17, my + 17); ctx.lineTo(mx + 25, my + 11); ctx.lineTo(mx + 25, my + 33); ctx.lineTo(mx + 17, my + 27); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = muted ? "#ff5d5d" : "#e6e9f5"; ctx.lineWidth = 3; ctx.lineCap = "round";
  if (muted){
    ctx.beginPath(); ctx.moveTo(mx + 29, my + 16); ctx.lineTo(mx + 39, my + 28); ctx.moveTo(mx + 39, my + 16); ctx.lineTo(mx + 29, my + 28); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(mx + 26, my + 22, 7, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(mx + 26, my + 22, 12, -0.9, 0.9); ctx.stroke();
  }
}

function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = "#0b0f1a";
  ctx.fillRect(0, 0, cv.width, cv.height);

  var sx = shake ? (Math.random() - 0.5) * shake : 0;
  var sy = shake ? (Math.random() - 0.5) * shake : 0;
  ctx.setTransform(scale, 0, 0, scale, ox + sx * scale, oy + sy * scale);

  // background fills the whole screen (any aspect ratio)
  var bg = ctx.createLinearGradient(0, visY0, 0, visY1);
  bg.addColorStop(0, "#141a33"); bg.addColorStop(1, "#0b0f1a");
  ctx.fillStyle = bg;
  ctx.fillRect(visX0 - 40, visY0 - 40, (visX1 - visX0) + 80, (visY1 - visY0) + 80);

  // side streaks
  for (var s = 0; s < stars.length; s++){
    var st = stars[s];
    if (st.x > ROAD_X - 14 && st.x < ROAD_X + LANE_W * LANES + 14) continue;
    if (st.x < visX0 - 10 || st.x > visX1 + 10) continue;
    ctx.globalAlpha = 0.18 + st.v * 0.35;
    ctx.fillStyle = st.c;
    ctx.fillRect(st.x, st.y, 2.5, st.len);
  }
  ctx.globalAlpha = 1;

  // road
  var rh = (visY1 - visY0) + 80;
  ctx.fillStyle = "#1f2540"; ctx.fillRect(ROAD_X, visY0 - 40, LANE_W * LANES, rh);
  ctx.fillStyle = "#4cc9f0";
  ctx.fillRect(ROAD_X - 4, visY0 - 40, 4, rh); ctx.fillRect(ROAD_X + LANE_W * LANES, visY0 - 40, 4, rh);
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  var startY = Math.floor((visY0 - 60) / 60) * 60 + roadOffset;
  for (var l = 1; l < LANES; l++){
    for (var y = startY; y < visY1 + 60; y += 60){
      ctx.fillRect(ROAD_X + LANE_W * l - 2, y, 4, 32);
    }
  }

  // coins
  for (var i = 0; i < coins.length; i++){
    var c = coins[i];
    ctx.fillStyle = "#ffd166";
    ctx.beginPath(); ctx.arc(laneX(c.lane), c.y, c.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#f4a300";
    ctx.beginPath(); ctx.arc(laneX(c.lane), c.y, c.r - 5, 0, Math.PI * 2); ctx.fill();
  }

  // shield pickups
  for (var u = 0; u < powerups.length; u++){
    var pw_ = powerups[u], pcx = laneX(pw_.lane);
    ctx.fillStyle = "rgba(76,201,240,0.25)";
    ctx.beginPath(); ctx.arc(pcx, pw_.y, pw_.r + 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#4cc9f0";
    ctx.beginPath(); ctx.arc(pcx, pw_.y, pw_.r, 0, Math.PI * 2); ctx.fill();
    text("S", pcx, pw_.y + 7, 20, "#0b3b52");
  }

  // obstacles
  for (var j = 0; j < obstacles.length; j++){
    var o = obstacles[j], x = laneX(o.lane) - o.w/2;
    ctx.fillStyle = "#ff5d5d"; rr(x, o.y, o.w, o.h, 10); ctx.fill();
    ctx.fillStyle = "#b53a3a"; rr(x + 8, o.y + 10, o.w - 16, 16, 5); ctx.fill();
    ctx.fillStyle = "#ffe0e0"; ctx.fillRect(x + 8, o.y + o.h - 12, 10, 6); ctx.fillRect(x + o.w - 18, o.y + o.h - 12, 10, 6);
  }

  // player
  if (state !== "over"){
    var pxx = player.x - PLAYER_W/2;
    ctx.fillStyle = "#4cc9f0"; rr(pxx, PLAYER_Y, PLAYER_W, PLAYER_H, 12); ctx.fill();
    ctx.fillStyle = "#0b3b52"; rr(pxx + 8, PLAYER_Y + 16, PLAYER_W - 16, 20, 6); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.fillRect(pxx + 6, PLAYER_Y + 4, 9, 5); ctx.fillRect(pxx + PLAYER_W - 15, PLAYER_Y + 4, 9, 5);
    if (player.shield){
      ctx.strokeStyle = "rgba(76,201,240," + (0.6 + 0.4 * Math.sin(performance.now() / 120)) + ")";
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(player.x, PLAYER_Y + PLAYER_H/2, 52, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // particles
  for (var p = 0; p < particles.length; p++){
    var pt = particles[p];
    ctx.globalAlpha = Math.max(0, pt.life * 2);
    ctx.fillStyle = pt.c;
    ctx.fillRect(pt.x - 3, pt.y - 3, 6, 6);
  }
  ctx.globalAlpha = 1;

  // HUD
  if (state === "play"){
    text(String(score), W/2, 56, 44, "#fff");
    text("BEST " + best, W - 16, 30, 16, "#9aa4c7", "right");
    if (gameTime < 3.5 && !paused){
      ctx.globalAlpha = Math.max(0, Math.min(1, (3.5 - gameTime)));
      text(isTouch ? "TAP LEFT / RIGHT SIDE" : "← →  or  A D", W/2, H - 24, 18, "#ffd166");
      ctx.globalAlpha = 1;
    }
  }

  // overlays
  var pulse = 0.6 + 0.4 * Math.sin(performance.now() / 250);
  if (state === "menu"){
    dim(0.72);
    text("NIGHT LANE", W/2, 232, 50, "#4cc9f0");
    text("RUSH", W/2, 284, 50, "#ffd166");
    text("Dodge the red cars, grab coins,", W/2, 330, 18, "#e6e9f5");
    text("catch the S shield to survive a hit!", W/2, 356, 18, "#e6e9f5");
    text(isTouch ? "Tap the left / right side to switch lanes" : "← → / A D keys, or click left / right", W/2, 398, 16, "#9aa4c7");
    ctx.globalAlpha = pulse; text(isTouch ? "TAP TO START" : "CLICK OR PRESS SPACE", W/2, 470, 28, "#ffd166"); ctx.globalAlpha = 1;
    if (best) text("BEST " + best, W/2, 520, 18, "#9aa4c7");
  } else if (state === "over"){
    dim(0.72);
    text("GAME OVER", W/2, 250, 46, "#ff5d5d");
    text("Score  " + score, W/2, 320, 34, "#fff");
    text(newBest ? "NEW BEST!" : "Best  " + best, W/2, 362, 22, "#ffd166");
    ctx.globalAlpha = pulse; text(isTouch ? "TAP TO RETRY" : "CLICK OR PRESS SPACE", W/2, 450, 26, "#4cc9f0"); ctx.globalAlpha = 1;
  } else if (paused){
    dim(0.6);
    text("PAUSED", W/2, 320, 46, "#fff");
    text(isTouch ? "Tap anywhere to resume" : "Press P / Esc / Space or click to resume", W/2, 370, 17, "#ffd166");
  }

  drawButtons();
}

// ---------- main loop ----------
var last = performance.now();
function frame(now){
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
